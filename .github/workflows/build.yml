name: Extract ZIP and Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and SDK packages
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(find "$SDK/cmdline-tools" -path '*bin/sdkmanager' | sort | tail -n1)

          set +o pipefail
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true

          "$SDKM" --sdk_root="$SDK" \
            "ndk;26.1.10909125" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Extract project
        shell: bash
        run: |
          ZIP=$(ls *.zip | sort | tail -n1)

          echo "Using $ZIP"

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP" -d extracted

          ROOT=$(dirname "$(find extracted -name settings.gradle | head -n1)")

          if [ ! -f "$ROOT/settings.gradle" ]; then
            echo "settings.gradle not found"
            exit 1
          fi

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.ROOT }}
        run: gradle --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          echo '### Build errors' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          grep -E \
            "error:|FAILED|What went wrong|Execution failed|not found|cannot find" \
            "$ROOT/build.log" | head -100 \
            >> "$GITHUB_STEP_SUMMARY" || true

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit extracted source
        if: success()
        shell: bash
        run: |
          rm -rf source
          mkdir source

          cp -a "$ROOT"/. source/

          rm -rf source/.git
          rm -rf source/.gradle

          find source -type d -name build -prune -exec rm -rf {} +

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add source

          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "Extract VirtualApp source from ZIP"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VirtualApp-debug-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
          
