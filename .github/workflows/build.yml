name: Build VirtualApp APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'source/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and SDK packages
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(find "$SDK/cmdline-tools" -path '*bin/sdkmanager' | sort | tail -n1)

          set +o pipefail
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          set -o pipefail

          "$SDKM" --sdk_root="$SDK" \
            "ndk;26.1.10909125" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build patched source
        shell: bash
        working-directory: source
        run: gradle --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          echo '### Build errors' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E \
            "error:|FAILED|What went wrong|Execution failed|not found|cannot find" \
            source/build.log | head -100 \
            >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VirtualApp-phase2j-debug-apk
          path: source/app/build/outputs/apk/debug/*.apk
