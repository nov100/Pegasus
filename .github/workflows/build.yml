name: Build APK from ZIP
on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK and SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;26.1.10909125" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        shell: bash
        run: |
          ZIP=$(ls *.zip | sort | tail -n1)
          echo "Using $ZIP"
          mkdir -p work && unzip -q "$ZIP" -d work
          ROOT=$(dirname "$(find work -name settings.gradle | head -n1)")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"
      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.ROOT }}
        run: gradle --no-daemon assembleDebug 2>&1 | tee build.log
      - name: Show errors in summary
        if: failure()
        shell: bash
        run: |
          echo '### Build errors' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|error:|FAILED|What went wrong|Execution failed|not found|cannot find" "$ROOT/build.log" | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VirtualApp-debug-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
          
